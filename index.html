<style>
@font-face{

  font-display:swap;
}
:root{
  --ink:#2c1f16;
  --ink2:#6a5748;
  --line:#3a2a20;
  --line2:#120c08;
  --paper:#f8f2e4;
  --paper2:#fffcf3;
  --amber:#e2a63c;
  --amber-l:#ffd678;
  --green:#4f9e63;
  --red:#d9604a;
  --gray:#9b9086;
  --fp:'Galmuri11','DungGeunMo',ui-sans-serif,system-ui,'Malgun Gothic',sans-serif;
  --fb:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--fb);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -10%, #4a3226 0%, #2b1d15 60%, #1d1310 100%) fixed;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  padding:18px 16px 28px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
  background-size:4px 4px;
  z-index:0;
}
.wrap{position:relative;z-index:1;max-width:1460px;margin:0 auto}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  display:grid;place-items:center;width:52px;height:52px;flex:none;font-size:26px;
  background:var(--amber);border:3px solid var(--line2);border-radius:10px;
  box-shadow:0 4px 0 rgba(0,0,0,.45);
}
.brand h1{
  margin:0;font-family:var(--fp);font-weight:400;font-size:clamp(17px,2.1vw,25px);
  color:#fff3dc;letter-spacing:-.2px;line-height:1.25;text-shadow:0 2px 0 rgba(0,0,0,.45);
}
.brand h1 .slash{color:var(--amber);padding:0 2px}
.brand .sub{margin:3px 0 0;font-size:12.5px;color:#cbb59d}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{
  display:flex;align-items:baseline;gap:5px;font-family:var(--fp);font-size:19px;color:#ffe9c2;
  background:#1a110c;border:2px solid #000;border-radius:8px;padding:6px 10px;
  box-shadow:inset 0 0 0 2px #2f2118;
}
.clock em{font-style:normal;font-size:11px;color:#8e7a63;letter-spacing:1px}
.stamp{font-size:12px;color:#c3ab92}
.stamp b{font-family:var(--fp);font-weight:400;color:#ffe9c2}

/* ---------- summary bar ---------- */
.summary{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(180deg,#fdf7ea,#f2e8d6);
  border:3px solid var(--line2);border-radius:12px;padding:9px 12px;
  box-shadow:0 5px 0 rgba(0,0,0,.35);
  margin-bottom:12px;
}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.stat{
  display:flex;align-items:center;gap:6px;font-family:var(--fp);font-size:12.5px;
  background:#fff;border:2px solid var(--line);border-radius:7px;padding:3px 8px 4px;
}
.stat i{width:9px;height:9px;border-radius:2px;display:block;background:var(--gray)}
.stat.running i{background:var(--green)}
.stat.waiting i{background:var(--amber)}
.stat.check i{background:var(--red)}
.stat.paused i{background:var(--gray)}
.stat b{font-weight:400;font-size:14px}
.headline{font-size:13px;color:var(--ink2);flex:1;min-width:180px;line-height:1.4}
.btn{
  font-family:var(--fp);font-size:12.5px;cursor:pointer;border-radius:7px;
  border:2px solid var(--line2);background:#fff;color:var(--ink);
  padding:5px 10px 6px;box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.ghost{background:#fff8e8}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:8px;scrollbar-width:thin}
.chip{
  display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;
  font-family:var(--fp);font-size:12.5px;color:#f4e6d1;
  background:#3a2a20;border:2px solid #000;border-radius:8px;padding:5px 9px 6px;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.chip:hover{background:#4a362a}
.chip[aria-selected="true"]{background:var(--amber);color:#2c1f16;border-color:var(--line2)}
.chip .dot{width:8px;height:8px;border-radius:2px;background:var(--gray);flex:none}
.chip.s-running .dot{background:var(--green)}
.chip.s-waiting .dot{background:var(--amber)}
.chip.s-check .dot{background:var(--red)}
.chip[aria-selected="true"] .dot{background:#2c1f16}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:1fr}}

/* ---------- stage ---------- */
.stage{
  position:relative;width:100%;aspect-ratio:1672/941;
  border:4px solid var(--line2);border-radius:12px;overflow:hidden;
  background:#3f4a34;
  box-shadow:0 8px 0 rgba(0,0,0,.4), 0 0 0 3px #543d2c inset;
}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}

.char{
  position:absolute;transform:translateX(-50%);
  padding:0;margin:0;border:0;background:none;cursor:pointer;
  display:block;line-height:0;
  -webkit-tap-highlight-color:transparent;
}
.char .bob{display:block;height:100%;animation:bob 3.2s ease-in-out infinite}
.char img{height:100%;width:auto;image-rendering:pixelated;display:block}
.char:nth-child(odd) .bob{animation-duration:3.6s}
.char:nth-child(3n) .bob{animation-delay:-1.1s}
.char:nth-child(2n) .bob{animation-delay:-.7s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2%)}}

.char::after{
  content:'';position:absolute;left:50%;bottom:-3%;width:78%;height:9%;
  transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(28,16,8,.42),rgba(28,16,8,0) 70%);
}
.char:hover .bob{animation-play-state:paused}
.char:hover img,.char.sel img{filter:drop-shadow(0 0 5px rgba(255,214,120,.95))}
.char:focus-visible{outline:3px dashed var(--amber-l);outline-offset:4px;border-radius:4px}
.char.sel{z-index:5}

.badge{
  position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;white-space:nowrap;
  font-family:var(--fp);font-size:clamp(7.5px,1.02vw,12px);line-height:1.1;
  color:#ffedd0;background:rgba(24,16,11,.88);
  border:2px solid #100a06;border-radius:6px;padding:3px 6px 4px;
  box-shadow:0 2px 0 rgba(0,0,0,.35);
}
.badge .dot{width:6px;height:6px;border-radius:1px;background:var(--gray);flex:none}
.badge .dot.on{background:var(--green);animation:blink 1.6s steps(2,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.badge .em{font-size:1.05em}
.badge::after{
  content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:4px solid transparent;border-top-color:#100a06;
}
.char.sel .badge{background:var(--amber);color:#241a12;border-color:#0d0805}
.char.sel .badge::after{border-top-color:#0d0805}

.bubble{
  position:absolute;left:50%;bottom:calc(100% + 36px);transform:translateX(-50%) scale(.96);
  max-width:230px;min-width:110px;white-space:normal;text-align:center;word-break:keep-all;
  font-family:var(--fp);font-size:clamp(8px,1.05vw,12.5px);line-height:1.45;
  color:#241a12;background:var(--amber-l);
  border:2px solid #0d0805;border-radius:8px;padding:5px 8px 6px;
  box-shadow:0 3px 0 rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;
  z-index:6;
}
.bubble::after{
  content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:#0d0805;
}
.char.sel .bubble,.char:hover .bubble{opacity:1;transform:translateX(-50%) scale(1)}

.stage .corner{
  position:absolute;right:8px;bottom:7px;font-family:var(--fp);font-size:11px;
  color:#f0dfc4;background:rgba(20,13,8,.62);border-radius:6px;padding:3px 7px 4px;
  pointer-events:none;
}
.stage .msg{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  font-family:var(--fp);font-size:12px;color:#ffe9c2;background:rgba(20,13,8,.8);
  border:2px solid #000;border-radius:7px;padding:5px 10px 6px;opacity:0;transition:opacity .2s;
}
.stage .msg.show{opacity:1}
.hint{margin:8px 2px 0;font-size:12px;color:#b9a58e}

/* ---------- panel ---------- */
.panel{
  background:linear-gradient(180deg,var(--paper2),var(--paper));
  border:3px solid var(--line2);border-radius:12px;
  box-shadow:0 8px 0 rgba(0,0,0,.4);
  padding:14px 14px 16px;position:sticky;top:14px;
}
@media (max-width:960px){.panel{position:static}}
.p-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.p-ava{
  width:56px;height:70px;object-fit:contain;image-rendering:pixelated;flex:none;

}
.p-title{min-width:0}
.p-title h2{

.p-title .em{font-size:15px}
.p-state{

.p-state i{width:8px;height:8px;border-radius:2px;background:var(--gray)}
.p-state.running i{background:var(--green)}
.p-state.waiting i{background:var(--amber)}
.p-state.check i{background:var(--red)}
.p-role{margin:0 0 12px;font-size:12.8px;color:var(--ink2);line-height:1.55;word-break:keep-all}
.panel h3{
  margin:14px 0 7px;font-family:var(--fp);font-weight:400;font-size:12px;letter-spacing:.6px;
  color:#8a745d;display:flex;align-items:center;gap:6px;
}
.panel h3::after{content:'';flex:1;height:2px;background:#e0d2ba}
.sched{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sched li{display:grid;grid-template-columns:82px 1fr;gap:8px;align-items:start;font-size:12.5px;line-height:1.45}
.sched time{
  font-family:var(--fp);font-size:11.5px;color:#3a2a20;background:#f0e2c8;
  border:2px solid #d9c5a4;border-radius:5px;padding:1px 4px 2px;text-align:center;
  word-break:keep-all;
}
.sched span{color:#43332a;word-break:keep-all}
.tasks{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.tasks li{
  position:relative;padding-left:15px;font-size:12.4px;line-height:1.5;color:#43332a;word-break:keep-all;
}
.tasks li::before{
  content:'';position:absolute;left:2px;top:.52em;width:6px;height:6px;background:var(--amber);
  border:1px solid #8a6a24;border-radius:1px;
}
.last{
  font-size:12.4px;line-height:1.5;background:#fff;border:2px solid #e0d2ba;border-radius:8px;
  padding:8px 10px;color:#43332a;word-break:keep-all;
}
.last .when{font-family:var(--fp);font-size:11px;color:#8a745d;display:block;margin-bottom:2px}
.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.links a{
  display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  font-family:var(--fp);font-size:12px;color:#2c1f16;background:var(--amber);
  border:2px solid var(--line2);border-radius:7px;padding:6px 10px 7px;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.links a:hover{background:var(--amber-l)}
.links a:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}

/* ---------- footer ---------- */
.foot{
  margin-top:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:11.5px;color:#9c8871;
}
.foot code{font-family:var(--fp);color:#e0c9a6}

@media (max-width:760px){
  body{padding:12px 10px 22px}
  .char{touch-action:manipulation}
  .char::before{content:'';position:absolute;inset:-16px -8px -12px -8px}
  .badge{display:none}
  .bubble{display:none}
  .logo{width:44px;height:44px;font-size:22px}
  .stage .corner{font-size:10px}
  .summary{padding:8px 10px}
  .headline{font-size:12.5px}
  .p-ava{width:48px;height:60px}
}
@media (prefers-reduced-motion:reduce){
  .char .bob{animation:none}
  .badge .dot.on{animation:none}
  .bubble{transition:none}
}
</style>
</head>

<script>
(function(){
  "use strict";

  var FALLBACK = JSON.parse(document.getElementById('boot').textContent);
  var DATA = FALLBACK;
  var SEL = 0;

  var LABEL = {running:'가동 중', waiting:'대기', paused:'일시정지', check:'확인 필요'};
  var ORDER = ['running','waiting','paused','check'];

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  };

  function kst(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    try{
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone:'Asia/Seoul', month:'long', day:'numeric',
        hour:'2-digit', minute:'2-digit', hour12:false
      }).format(d);
    }catch(e){ return '—'; }
  }

  function counts(){
    var c = {running:0, waiting:0, paused:0, check:0};
    DATA.employees.forEach(function(e){ if (c[e.state] != null) c[e.state]++; });
    return c;
  }

  function renderTop(){
    var c = counts();
    $('stats').innerHTML = ORDER.filter(function(k){ return c[k] > 0; }).map(function(k){
      return '<div class="stat ' + k + '"><i></i>' + LABEL[k] + ' <b>' + c[k] + '</b></div>';
    }).join('');
    $('headline').textContent = DATA.headline || '';
    $('updated').textContent = kst(DATA.updated);
  }

  function renderChips(){
    $('chips').innerHTML = DATA.employees.map(function(e, i){
      return '<button class="chip s-' + esc(e.state) + '" type="button" role="tab" data-i="' + i + '"' +
        ' aria-controls="panel" aria-selected="' + (i === SEL) + '">' +
        '<span class="dot"></span><span aria-hidden="true">' + esc(e.emoji) + '</span>' +
        '<span>' + esc(e.name) + '</span>' +
        '<span style="opacity:.66;font-size:11px">' + esc(e.stateLabel || LABEL[e.state] || '') + '</span>' +
        '</button>';
    }).join('');
  }

  function renderStage(){
    var stage = $('stage');
    stage.querySelectorAll('.char').forEach(function(n){ n.remove(); });
    DATA.employees.forEach(function(e, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'char' + (i === SEL ? ' sel' : '');
      b.style.left = (e.x != null ? e.x : (14 + i * 14.4)) + '%';
      b.style.bottom = (100 - (e.feet != null ? e.feet : 79)) + '%';
      b.style.height = (e.h || 25) + '%';
      b.setAttribute('aria-label', e.name + ' — ' + (e.stateLabel || ''));
      b.dataset.i = i;
      b.innerHTML =
        '<span class="bob"><img src="' + esc(e.sprite) + '" alt="' + esc(e.name) + ' 캐릭터"></span>' +
        '<span class="badge"><span class="dot' + (e.state === 'running' ? ' on' : '') + '"></span>' +
          '<span class="em" aria-hidden="true">' + esc(e.emoji) + '</span>' +
          '<span>' + esc(e.stateLabel || LABEL[e.state] || '') + '</span></span>' +
        '<span class="bubble">' + esc(e.bubble || '') + '</span>';
      stage.appendChild(b);
    });
  }

  function renderPanel(){
    var e = DATA.employees[SEL];
    if (!e) return;
    var html = '';
    html += '<div class="p-head">';
    html += '<img class="p-ava" src="' + esc(e.sprite) + '" alt="">';
    html += '<div class="p-title"><h2><span class="em" aria-hidden="true">' + esc(e.emoji) + '</span> ' + esc(e.name) + '</h2>';
    html += '<span class="p-state ' + esc(e.state) + '"><i></i>' + esc(e.stateLabel || LABEL[e.state] || '') + '</span>';
    html += '</div></div>';
    html += '<p class="p-role">' + esc(e.role || '') + '</p>';

    if (e.schedule && e.schedule.length){
      html += '<h3>일정</h3><ul class="sched">';
      e.schedule.forEach(function(s){
        html += '<li><time>' + esc(s.time) + '</time><span>' + esc(s.text) + '</span></li>';
      });
      html += '</ul>';
    }
    if (e.details && e.details.length){
      html += '<h3>담당 업무</h3><ul class="tasks">';
      e.details.forEach(function(d){ html += '<li>' + esc(d) + '</li>'; });
      html += '</ul>';
    }
    if (e.last && e.last.text){
      html += '<h3>최근 결과</h3><div class="last"><span class="when">' + esc(e.last.at || '') + '</span>' + esc(e.last.text) + '</div>';
    }
    if (e.links && e.links.length){
      html += '<div class="links">';
      e.links.forEach(function(l){
        html += '<a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + ' ↗</a>';
      });
      html += '</div>';
    }
    $('panel').innerHTML = html;
  }

  function render(){
    if (SEL >= DATA.employees.length) SEL = 0;
    renderTop();
    renderChips();
    renderStage();
    renderPanel();
  }

  function select(i, scroll){
    SEL = i;
    document.querySelectorAll('.char').forEach(function(n){
      n.classList.toggle('sel', Number(n.dataset.i) === i);
    });
    document.querySelectorAll('.chip').forEach(function(n){
      n.setAttribute('aria-selected', String(Number(n.dataset.i) === i));
    });
    renderPanel();
    var id = DATA.employees[i] && DATA.employees[i].id;
    if (id && history.replaceState) {
      try { history.replaceState(null, '', '#' + id); } catch(err) {}
    }
    if (scroll && window.innerWidth <= 960){
      var p = $('panel');
      if (p) p.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }

  function flash(text){
    var m = $('msg');
    m.textContent = text;
    m.classList.add('show');
    clearTimeout(flash.t);
    flash.t = setTimeout(function(){ m.classList.remove('show'); }, 1600);
  }

  // interactions
  $('stage').addEventListener('click', function(ev){
    var btn = ev.target.closest ? ev.target.closest('.char') : null;
    if (!btn) return;
    select(Number(btn.dataset.i), true);
  });
  $('stage').addEventListener('keydown', function(ev){
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft'){
      ev.preventDefault();
      select((SEL + (ev.key === 'ArrowRight' ? 1 : DATA.employees.length - 1)) % DATA.employees.length, false);
      var cur = document.querySelector('.char.sel');
      if (cur) cur.focus();
    }
  });
  $('chips').addEventListener('click', function(ev){
    var chip = ev.target.closest ? ev.target.closest('.chip') : null;
    if (!chip) return;
    select(Number(chip.dataset.i), true);
  });
  $('refresh').addEventListener('click', function(){ load(true); });

  // clock
  function tick(){
    var s;
    try{
      s = new Intl.DateTimeFormat('ko-KR', {
        timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
      }).format(new Date());
    }catch(e){ s = new Date().toLocaleTimeString(); }
    $('clock').textContent = s;
  }
  tick();
  setInterval(tick, 1000);

  // data
  function load(announce){
    fetch('status.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        if (!j || !Array.isArray(j.employees) || !j.employees.length) throw new Error('empty');
        DATA = j;
        render();
        if (announce) flash('status.json 새로 불러왔어요');
      })
      .catch(function(){
        if (announce) flash('status.json을 못 불러와 내장 상태를 보여줘요');
      });
  }

  // initial: hash deep link
  (function init(){
    var h = (location.hash || '').replace('#','');
    if (h){
      DATA.employees.forEach(function(e, i){ if (e.id === h) SEL = i; });
    }
    render();
    load(false);
  })();

  // keep an open tab in sync with status.json (5분마다)
  setInterval(function(){
    if (!document.hidden) load(false);
  }, 300000);
})();
</script>
