<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>민상파파 컴퍼니 · 원형 회의실</title>
<meta name="description" content="성남분당뷰티 AI 팀장 7명이 원형 회의 테이블에 둘러앉아 돌리는 일을 한눈에 보는 가상 사무실입니다.">
<link rel="icon" href="favicon.png">
<meta name="theme-color" content="#FBF4E6">
<meta property="og:type" content="website">
<meta property="og:title" content="민상파파 컴퍼니 · 원형 회의실">
<meta property="og:description" content="AI 팀장 7명이 원형 회의 테이블에 둘러앉아 지금 돌리고 있는 일을 한눈에 봅니다.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
:root{
  --cream:#FBF4E6;
  --cream2:#FFFCF5;
  --card:#FFFFFF;
  --ink:#3E3A33;
  --ink2:#7C7568;
  --ink3:#A39C8D;
  --line:#EFE6D3;
  --line2:#E4D8C2;
  --green:#3FA45F;
  --green-d:#2E7F48;
  --green-l:#E9F6EC;
  --mint:#BCE3D6;
  --amber:#E9A93C;
  --coral:#E4735C;
  --gray:#BFB7A8;
  --sh:0 10px 30px rgba(120,102,70,.10);
  --sh2:0 4px 14px rgba(120,102,70,.08);
  --fp:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--fp);color:var(--ink);
  background:
    radial-gradient(900px 460px at 8% -6%, #F3EBD6 0%, rgba(243,235,214,0) 70%),
    radial-gradient(900px 520px at 96% 2%, #EDF5E6 0%, rgba(237,245,230,0) 68%),
    var(--cream);
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  padding:20px 18px 30px;
}
a{color:var(--green-d)}
.wrap{position:relative;max-width:1420px;margin:0 auto}

/* ---------- header ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  padding:13px 18px;box-shadow:var(--sh);margin-bottom:12px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:50px;height:50px;flex:none;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(160deg,#F0FAF3,#DDF1E4);border:1.5px solid #CFE7D8;
}
.logo svg{width:34px;height:34px;display:block}
.brand h1{margin:0;font-size:clamp(16px,1.9vw,21px);font-weight:800;letter-spacing:-.4px;color:#37423A}
.brand .sub{margin:3px 0 0;font-size:12.5px;color:var(--ink2);font-weight:500}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{
  display:flex;align-items:baseline;gap:5px;font-size:16px;font-weight:700;color:#3C4A40;
  background:#F4FAF5;border:1.5px solid #DDEEDF;border-radius:12px;padding:6px 11px;
  font-variant-numeric:tabular-nums;
}
.clock em{font-style:normal;font-size:10.5px;font-weight:700;color:#8FA497;letter-spacing:.6px}
.stamp{font-size:12px;color:var(--ink2)}
.stamp b{font-weight:700;color:#4A564C}

/* ---------- summary ---------- */
.summary{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;
  padding:9px 12px;box-shadow:var(--sh2);margin-bottom:12px;
}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  border-radius:999px;padding:5px 10px 6px;background:#F7F4EC;color:#5D574C;
}
.stat i{width:8px;height:8px;border-radius:50%;display:block;background:var(--gray)}
.stat.running{background:#EAF6EE;color:#2E7F48}
.stat.running i{background:#46B26B;animation:blink 1.8s ease-in-out infinite}
.stat.waiting{background:#FCF3E0;color:#9A6C12}
.stat.waiting i{background:#E9B44C}
.stat.check{background:#FDEEE9;color:#B4503B}
.stat.check i{background:#E4735C}
.stat.paused{background:#F3F1EC;color:#7E776A}
.stat.paused i{background:#BFB7A8}
.stat b{font-weight:800}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.headline{font-size:12.8px;color:#6F6A5E;flex:1;min-width:200px;line-height:1.5;font-weight:500}
.btn{
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border-radius:999px;
  border:1.5px solid #CFE7D8;background:#F2FAF4;color:#2E7F48;padding:7px 14px;
  transition:background .15s,transform .1s;
}
.btn:hover{background:#E5F5EA}
.btn:active{transform:scale(.97)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 1px 10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit;
  font-size:12.5px;font-weight:600;color:#5D574C;background:var(--card);
  border:1.5px solid var(--line2);border-radius:999px;padding:6px 12px 7px;
  box-shadow:0 2px 6px rgba(120,102,70,.06);transition:transform .12s,box-shadow .12s,background .12s;
}
.chip:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(120,102,70,.12)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--gray);flex:none}
.chip .dot.running{background:#46B26B}
.chip .dot.waiting{background:#E9B44C}
.chip .dot.check{background:#E4735C}
.chip[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 14px rgba(63,164,95,.26)}
.chip[aria-selected="true"] .dot{background:#fff}
.chip small{font-size:10.5px;font-weight:600;opacity:.62}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 368px;gap:14px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}

/* ---------- stage ---------- */
.stage-wrap{min-width:0}
.stage{
  position:relative;width:100%;aspect-ratio:1000/588;
  border:1.5px solid #EFE4CE;border-radius:26px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, #FFFDF6 0%, #FBF4E4 62%, #F6ECDA 100%);
  box-shadow:var(--sh);
  /* table geometry (데스크톱) */
  --tx:15%;--ty:37%;--tw:70%;--th:53%;
}
.deco{position:absolute;border-radius:50%;pointer-events:none}
.d1{left:-6%;top:8%;width:26%;height:46%;background:#EDE7FA;opacity:.85}
.d2{right:-5%;top:2%;width:22%;height:34%;background:#FBF0C9;opacity:.9}
.d3{right:6%;bottom:-14%;width:24%;height:38%;background:#E6F4EA;opacity:.9}
.d4{left:4%;bottom:-16%;width:20%;height:32%;background:#FCE9E1;opacity:.85}
.stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 0 60px rgba(196,178,142,.16);
}

/* 지니 · 지시 */
.zini-wrap{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;
  padding-top:2.2%}
.phone{width:clamp(24px,2.9vw,34px)}
.phone svg{display:block;width:100%;height:auto}
.zarrow{width:clamp(10px,1.2vw,14px);opacity:.9;margin:1px 0 0}
.zarrow svg{display:block;width:100%;height:auto}
.zini{display:flex;flex-direction:column;align-items:center;gap:1px;margin:0}
.zini img{width:clamp(46px,6.4vw,84px);height:auto;display:block;
  filter:drop-shadow(0 6px 10px rgba(70,130,85,.16))}
.zini .tag{--tagbg:#EAF8EE;--tagbd:#C7E8D2;--tagink:#2E7F48}
.tag{
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  background:var(--tagbg,#fff);border:1.5px solid var(--tagbd,#EFE6D3);color:var(--tagink,#4A453D);
  border-radius:999px;padding:3px 9px 4px;font-size:clamp(9px,1.02vw,11.5px);line-height:1;
  box-shadow:0 2px 6px rgba(120,102,70,.10);font-weight:600;
}
.tag .dot{width:6px;height:6px;border-radius:50%;background:var(--gray);flex:none}
.tag .dot.running{background:#46B26B;animation:blink 1.8s ease-in-out infinite}
.tag .dot.waiting{background:#E9B44C}
.tag .dot.check{background:#E4735C}
.tag .dot.paused{background:#BFB7A8}
.tag b{font-weight:800}
.tag em{font-style:normal;color:#9A9385;font-weight:600}

/* 지시 화살표 */
.arrows{position:absolute;inset:0;z-index:2;pointer-events:none}
.arrows .arw{position:absolute;width:clamp(14px,1.7vw,22px);transform:translate(-50%,0);opacity:.85}
.arrows .arw svg{display:block;width:100%;height:auto}

/* 테이블 */
.table-shadow{position:absolute;left:calc(var(--tx) - 2%);top:calc(var(--ty) + var(--th) - 8%);
  width:calc(var(--tw) + 4%);height:22%;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(120,140,105,.24),rgba(120,140,105,0) 68%);
  filter:blur(4px)}
.table-rim{position:absolute;left:var(--tx);top:calc(var(--ty) + var(--th) * .07);
  width:var(--tw);height:var(--th);border-radius:50%;z-index:2;
  background:linear-gradient(180deg,#A9D6C5,#93C6B3)}
.table-top{position:absolute;left:var(--tx);top:var(--ty);width:var(--tw);height:var(--th);
  border-radius:50%;z-index:2;
  background:linear-gradient(165deg,#EAF8F1 0%,#D2EEE2 45%,#BFE3D3 100%);
  box-shadow:inset 0 -8px 18px rgba(120,170,150,.16), inset 0 6px 14px rgba(255,255,255,.65);
  border:1.5px solid #A9D6C5}
.table-top::after{
  content:'';position:absolute;left:14%;top:8%;width:52%;height:30%;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);
}

/* 테이블 위 소품 */
.items{position:absolute;inset:0;z-index:3;pointer-events:none}
.it{position:absolute;transform:translate(-50%,-50%)}
.it svg{display:block;width:100%;height:auto}
.it-chart{left:50%;top:62%;width:18%;filter:drop-shadow(0 3px 5px rgba(110,120,100,.14))}
.it-lap1{left:32.5%;top:66%;width:12.5%;filter:drop-shadow(0 3px 5px rgba(110,120,100,.14))}
.it-lap2{left:67.5%;top:63.5%;width:12.5%;filter:drop-shadow(0 3px 5px rgba(110,120,100,.14))}
.it-mug1{left:77.5%;top:54%;width:4.2%;filter:drop-shadow(0 2px 4px rgba(110,120,100,.16))}
.it-mug2{left:23.5%;top:73%;width:4.2%;filter:drop-shadow(0 2px 4px rgba(110,120,100,.16))}
.it-note{left:29%;top:52.5%;width:8%;filter:drop-shadow(0 2px 4px rgba(110,120,100,.12))}
.it-plant{left:61%;top:47.5%;width:6.6%;filter:drop-shadow(0 3px 5px rgba(110,120,100,.14))}
.it-pens{left:56%;top:80%;width:7%;filter:drop-shadow(0 2px 4px rgba(110,120,100,.12))}

/* 캐릭터 */
.char{
  position:absolute;left:var(--x);bottom:calc(100% - var(--feet));width:var(--w);z-index:var(--z,3);
  transform:translateX(-50%);padding:0;margin:0;border:0;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  -webkit-tap-highlight-color:transparent;font-family:inherit;
  transition:transform .18s ease;
}
.char img{width:100%;height:auto;display:block;
  filter:drop-shadow(0 6px 10px rgba(120,100,70,.14));
  transition:transform .18s ease,filter .18s ease;animation:bob 4.4s ease-in-out infinite}
.char:nth-of-type(2n) img{animation-duration:5.1s;animation-delay:-1.2s}
.char:nth-of-type(3n) img{animation-duration:4.8s;animation-delay:-.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.char:hover img{animation-play-state:paused}
.char:hover img,.char.sel img{filter:drop-shadow(0 10px 16px rgba(90,130,95,.24))}
.char:hover{transform:translateX(-50%) translateY(-2px)}
.char.sel img{transform:translateY(-2px) scale(1.03);animation-play-state:paused}

/* 좌석 (데스크톱) */
.char.seat-1{--x:29%;--feet:43%;--w:9.2%;--z:3}
.char.seat-2{--x:71%;--feet:43%;--w:9.2%;--z:3}
.char.seat-3{--x:11%;--feet:72%;--w:10.2%;--z:3}
.char.seat-4{--x:89%;--feet:72%;--w:10.2%;--z:3}
.char.seat-5{--x:27.5%;--feet:90.5%;--w:10.8%;--z:4}
.char.seat-6{--x:50%;--feet:91.5%;--w:11%;--z:5}
.char.seat-7{--x:72.5%;--feet:90.5%;--w:10.8%;--z:4}
.char.sel .tag{background:var(--green);border-color:var(--green);color:#fff}
.char.sel .tag b{color:#fff}
.char.sel .tag em{color:rgba(255,255,255,.86)}
.char.sel .tag .dot{background:#fff!important;animation:none}
.char:focus-visible{outline:none}
.char:focus-visible img{filter:drop-shadow(0 0 0 3px #fff) drop-shadow(0 0 8px rgba(63,164,95,.7))}
.char::after{content:'';position:absolute;inset:-14px -8px -8px -8px;border-radius:24px}
@media (prefers-reduced-motion:reduce){.char img{animation:none}}

/* 말풍선 */
.bubble{
  position:absolute;left:50%;bottom:calc(100% - 4px);transform:translateX(-50%) translateY(4px);
  width:max-content;max-width:210px;text-align:center;word-break:keep-all;
  font-size:11.5px;line-height:1.5;font-weight:600;color:#4A453D;
  background:#fff;border:1.5px solid #E7DCC6;border-radius:14px;padding:7px 11px 8px;
  box-shadow:0 8px 18px rgba(120,102,70,.16);
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:9;
}
.bubble::after{
  content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:#fff;
}
.char.sel .bubble,.char:hover .bubble{opacity:1;transform:translateX(-50%) translateY(0)}

.stage .corner{
  position:absolute;right:12px;bottom:10px;font-size:11px;font-weight:600;color:#8A8574;
  background:rgba(255,255,255,.82);border:1px solid #EDE3CE;border-radius:999px;
  padding:4px 10px 5px;pointer-events:none;backdrop-filter:blur(3px);
}
.stage .msg{
  position:absolute;left:50%;top:12px;transform:translateX(-50%) translateY(-6px);
  font-size:12px;font-weight:600;color:#3C4A40;background:rgba(255,255,255,.94);
  border:1.5px solid #DDEEDF;border-radius:999px;padding:6px 14px;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;z-index:10;
}
.stage .msg.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{margin:9px 4px 0;font-size:12px;color:var(--ink2);line-height:1.6}
.hint code{font-size:11.5px;background:#F2EBDC;border-radius:5px;padding:1px 5px;color:#6B6355}

/* ---------- panel ---------- */
.panel{
  background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  box-shadow:var(--sh);padding:16px 16px 18px;position:sticky;top:16px;
}
@media (max-width:980px){.panel{position:static}}
.p-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.p-ava{
  width:62px;height:62px;flex:none;border-radius:20px;object-fit:contain;
  background:linear-gradient(160deg,#F5FBF6,#E8F3EA);border:1.5px solid #DCEBDD;padding:5px;
}
.p-title{min-width:0}
.p-title h2{margin:0;font-size:17.5px;font-weight:800;line-height:1.35;word-break:keep-all;color:#37423A}
.p-title h2 .em{font-size:15px}
.p-state{
  display:inline-flex;align-items:center;gap:5px;margin-top:6px;
  font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 9px 5px;
  background:#F3F1EA;color:#6F695C;
}
.p-state i{width:7px;height:7px;border-radius:50%;background:var(--gray)}
.p-state.running{background:#EAF6EE;color:#2E7F48}
.p-state.running i{background:#46B26B}
.p-state.waiting{background:#FCF3E0;color:#9A6C12}
.p-state.waiting i{background:#E9B44C}
.p-state.check{background:#FDEEE9;color:#B4503B}
.p-state.check i{background:#E4735C}
.p-state.paused{background:#F3F1EC;color:#7E776A}
.p-role{margin:0 0 4px;font-size:12.8px;color:#6F6A5E;line-height:1.65;word-break:keep-all;font-weight:500}
.panel h3{
  margin:16px 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.6px;color:#8D8778;
  display:flex;align-items:center;gap:8px;
}
.panel h3::after{content:'';flex:1;height:1.5px;background:var(--line);border-radius:2px}
.sched{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sched li{display:grid;grid-template-columns:84px 1fr;gap:9px;align-items:start;font-size:12.5px;line-height:1.5}
.sched time{
  font-size:11px;font-weight:700;color:#4C5C4F;background:#F1F8F2;border:1.5px solid #DDEDE1;
  border-radius:8px;padding:2px 4px 3px;text-align:center;word-break:keep-all;
}
.sched span{color:#5C574C;word-break:keep-all;font-weight:500}
.tasks{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.tasks li{position:relative;padding-left:17px;font-size:12.5px;line-height:1.55;color:#5C574C;word-break:keep-all;font-weight:500}
.tasks li::before{
  content:'';position:absolute;left:2px;top:.5em;width:7px;height:7px;border-radius:50%;
  background:var(--mint);border:1.5px solid #9DCDBC;
}
.last{
  font-size:12.5px;line-height:1.6;background:#FBF7EE;border:1.5px solid #F0E6D2;border-radius:14px;
  padding:10px 12px;color:#5C574C;word-break:keep-all;font-weight:500;
}
.last .when{font-size:10.5px;font-weight:800;color:#A1988A;display:block;margin-bottom:3px;letter-spacing:.3px}
.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.links a{
  display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  font-size:12px;font-weight:700;color:#2E7F48;background:#F1FAF3;
  border:1.5px solid #CFE7D8;border-radius:999px;padding:7px 13px 8px;
  transition:background .15s,transform .1s;
}
.links a:hover{background:#E3F5E9}
.links a:active{transform:scale(.98)}

/* ---------- footer ---------- */
.foot{
  margin-top:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:11.5px;color:#A79F8E;padding:0 6px;
}
.foot a{color:#8FA58F;text-decoration:none}
.foot code{font-size:11px;background:#F2EBDC;border-radius:5px;padding:1px 5px;color:#7D7565}

/* ---------- 모바일 ---------- */
@media (max-width:760px){
  body{padding:12px 10px 24px}
  .top{padding:11px 13px;border-radius:18px;gap:10px}
  .logo{width:42px;height:42px;border-radius:13px}
  .brand h1{font-size:16px}
  .brand .sub{font-size:11.5px}
  .meta{width:100%;justify-content:space-between}
  .clock{font-size:14px;padding:5px 9px}
  .summary{padding:8px 10px;border-radius:16px}
  .headline{font-size:12px}
  .chips{gap:6px}
  .chip{font-size:11.5px;padding:5px 10px 6px}
  .chip small{display:none}
  .stage{aspect-ratio:360/540;border-radius:22px;
    --tx:5%;--ty:41%;--tw:90%;--th:37.5%;}
  .arrows{display:none}
  .items .it-chart{width:25%;left:50%;top:58%}
  .items .it-lap1{width:17%;left:32%;top:62%}
  .items .it-lap2{width:17%;left:68%;top:60%}
  .items .it-mug1{width:5.6%;left:79%;top:50%}
  .items .it-mug2{width:5.6%;left:21%;top:66%}
  .items .it-note{width:11%;left:27%;top:50%}
  .items .it-plant{width:9%;left:62%;top:47%}
  .items .it-pens{width:9%;left:56%;top:69%}
  .bubble{display:none}
  .stage .corner{display:none}
  .zini img{width:44px}
  .char img{animation:none}

<script>
(function(){
  "use strict";

  var FALLBACK = JSON.parse(document.getElementById('boot').textContent);
  var DATA = FALLBACK;
  var SEL = 0;

  var LABEL = {running:'운영 중', waiting:'대기', paused:'일시정지', check:'확인 필요'};
  var ORDER = ['running','waiting','check','paused'];

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  };
  var shortName = function(n){
    return String(n || '')
      .replace(/\s*팀장$/,'')
      .replace(/^성남\s*/,'')
      .replace(/\s*공지$/,'').trim();
  };

  function kst(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    try{
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone:'Asia/Seoul', month:'long', day:'numeric',
        hour:'2-digit', minute:'2-digit', hour12:false
      }).format(d);
    }catch(e){ return '—'; }
  }

  function counts(){
    var c = {running:0, waiting:0, paused:0, check:0};
    DATA.employees.forEach(function(e){ if (c[e.state] != null) c[e.state]++; });
    return c;
  }

  function renderTop(){
    var c = counts();
    $('stats').innerHTML = ORDER.filter(function(k){ return c[k] > 0; }).map(function(k){
      return '<div class="stat ' + k + '"><i></i>' + LABEL[k] + ' <b>' + c[k] + '</b></div>';
    }).join('');
    $('headline').textContent = DATA.headline || '';
    $('updated').textContent = kst(DATA.updated);
  }

  function renderChips(){
    $('chips').innerHTML = DATA.employees.map(function(e, i){
      return '<button class="chip" type="button" role="tab" data-i="' + i + '"' +
        ' aria-controls="panel" aria-selected="' + (i === SEL) + '">' +
        '<span class="dot ' + esc(e.state) + '"></span>' +
        '<span aria-hidden="true">' + esc(e.emoji) + '</span>' +
        '<span>' + esc(e.name) + '</span>' +
        '<small>' + esc(e.stateLabel || LABEL[e.state] || '') + '</small>' +
        '</button>';
    }).join('');
  }

  function renderStage(){
    var stage = $('stage');
    stage.querySelectorAll('.char').forEach(function(n){ n.remove(); });
    DATA.employees.forEach(function(e, i){
      var seat = e.seat || (i + 1);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'char seat-' + seat + (i === SEL ? ' sel' : '');
      b.dataset.i = i;
      b.dataset.state = e.state;
      b.setAttribute('aria-label', e.name + ' — ' + (e.stateLabel || LABEL[e.state] || ''));
      b.innerHTML =
        '<span class="bubble">' + esc(e.bubble || '') + '</span>' +
        '<img src="' + esc(e.sprite) + '" alt="' + esc(e.name) + ' 캐릭터" loading="lazy">' +
        '<span class="tag"><i class="dot ' + esc(e.state) + '"></i>' +
          '<b>' + esc(shortName(e.name)) + '</b>' +
          '<em>' + esc(e.stateLabel || LABEL[e.state] || '') + '</em></span>';
      stage.appendChild(b);
    });
  }

  function renderPanel(){
    var e = DATA.employees[SEL];
    if (!e) return;
    var html = '';
    html += '<div class="p-head">';
    html += '<img class="p-ava" src="' + esc(e.sprite) + '" alt="">';
    html += '<div class="p-title"><h2><span class="em" aria-hidden="true">' + esc(e.emoji) + '</span> ' + esc(e.name) + '</h2>';
    html += '<span class="p-state ' + esc(e.state) + '"><i></i>' + esc(e.stateLabel || LABEL[e.state] || '') + '</span>';
    html += '</div></div>';
    html += '<p class="p-role">' + esc(e.role || '') + '</p>';

    if (e.schedule && e.schedule.length){
      html += '<h3>일정</h3><ul class="sched">';
      e.schedule.forEach(function(s){
        html += '<li><time>' + esc(s.time) + '</time><span>' + esc(s.text) + '</span></li>';
      });
      html += '</ul>';
    }
    if (e.details && e.details.length){
      html += '<h3>담당 업무</h3><ul class="tasks">';
      e.details.forEach(function(d){ html += '<li>' + esc(d) + '</li>'; });
      html += '</ul>';
    }
    if (e.last && e.last.text){
      html += '<h3>최근 결과</h3><div class="last"><span class="when">' + esc(e.last.at || '') + '</span>' + esc(e.last.text) + '</div>';
    }
    if (e.links && e.links.length){
      html += '<div class="links">';
      e.links.forEach(function(l){
        html += '<a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + ' ↗</a>';
      });
      html += '</div>';
    }
    $('panel').innerHTML = html;
  }

  function render(){
    if (SEL >= DATA.employees.length) SEL = 0;
    renderTop();
    renderChips();
    renderStage();
    renderPanel();
  }

  function select(i, scroll){
    SEL = i;
    document.querySelectorAll('.char').forEach(function(n){
      n.classList.toggle('sel', Number(n.dataset.i) === i);
    });
    document.querySelectorAll('.chip').forEach(function(n){
      n.setAttribute('aria-selected', String(Number(n.dataset.i) === i));
    });
    renderPanel();
    var id = DATA.employees[i] && DATA.employees[i].id;
    if (id && history.replaceState) {
      try { history.replaceState(null, '', '#' + id); } catch(err) {}
    }
    if (scroll && window.innerWidth <= 980){
      var p = $('panel');
      if (p) p.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }

  function flash(text){
    var m = $('msg');
    m.textContent = text;
    m.classList.add('show');
    clearTimeout(flash.t);
    flash.t = setTimeout(function(){ m.classList.remove('show'); }, 1800);
  }

  // interactions
  $('stage').addEventListener('click', function(ev){
    var btn = ev.target.closest ? ev.target.closest('.char') : null;
    if (!btn) return;
    select(Number(btn.dataset.i), true);
  });
  $('stage').addEventListener('keydown', function(ev){
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft'){
      ev.preventDefault();
      select((SEL + (ev.key === 'ArrowRight' ? 1 : DATA.employees.length - 1)) % DATA.employees.length, false);
      var cur = document.querySelector('.char.sel');
      if (cur) cur.focus();
    }
  });
  $('chips').addEventListener('click', function(ev){
    var chip = ev.target.closest ? ev.target.closest('.chip') : null;
    if (!chip) return;
    select(Number(chip.dataset.i), true);
  });
  $('refresh').addEventListener('click', function(){ load(true); });

  // clock
  function tick(){
    var s;
    try{
      s = new Intl.DateTimeFormat('ko-KR', {
        timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
      }).format(new Date());
    }catch(e){ s = new Date().toLocaleTimeString(); }
    $('clock').textContent = s;
  }
  tick();
  setInterval(tick, 1000);

  // data
  function load(announce){
    fetch('status.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        if (!j || !Array.isArray(j.employees) || !j.employees.length) throw new Error('empty');
        DATA = j;
        render();
        if (announce) flash('status.json 새로 불러왔어요');
      })
      .catch(function(){
        if (announce) flash('status.json을 못 불러와 내장 상태를 보여줘요');
      });
  }

  // initial: hash deep link
  (function init(){
    var h = (location.hash || '').replace('#','');
    if (h){
      DATA.employees.forEach(function(e, i){ if (e.id === h) SEL = i; });
    }
    render();
    load(false);
  })();

  // keep an open tab in sync with status.json (5분마다)
  setInterval(function(){
    if (!document.hidden) load(false);
  }, 300000);
})();
</script>
